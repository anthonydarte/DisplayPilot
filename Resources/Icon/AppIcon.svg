<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D7BFF"/>
      <stop offset="0.55" stop-color="#2B45D6"/>
      <stop offset="1" stop-color="#1A1C6B"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1A45"/>
      <stop offset="1" stop-color="#1B2F7A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD66B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFD66B" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <!-- Fond squircle macOS -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gloss)"/>

  <g clip-path="url(#sq)">
    <!-- Écran secondaire (arrière-plan) -->
    <g opacity="0.55" filter="url(#soft)">
      <rect x="470" y="232" width="330" height="222" rx="26" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="16"/>
    </g>

    <!-- Écran principal -->
    <g filter="url(#soft)">
      <rect x="208" y="318" width="520" height="346" rx="36" fill="#F4F7FF"/>
      <rect x="236" y="346" width="464" height="290" rx="18" fill="url(#screen)"/>
      <!-- pied -->
      <path d="M430 664 h76 l18 86 h-112 z" fill="#E3E9FA"/>
      <rect x="360" y="742" width="216" height="26" rx="13" fill="#F4F7FF"/>
    </g>

    <!-- Soleil de luminosité, moitié pleine / moitié contour -->
    <g transform="translate(468 491)">
      <circle r="120" fill="url(#glow)"/>
      <g stroke="#FFD66B" stroke-width="16" stroke-linecap="round">
        <line x1="0" y1="-104" x2="0" y2="-80"/>
        <line x1="0" y1="80" x2="0" y2="104"/>
        <line x1="-104" y1="0" x2="-80" y2="0"/>
        <line x1="80" y1="0" x2="104" y2="0"/>
        <line x1="-73.5" y1="-73.5" x2="-56.5" y2="-56.5"/>
        <line x1="56.5" y1="56.5" x2="73.5" y2="73.5"/>
        <line x1="-73.5" y1="73.5" x2="-56.5" y2="56.5"/>
        <line x1="56.5" y1="-56.5" x2="73.5" y2="-73.5"/>
      </g>
      <circle r="52" fill="none" stroke="#FFD66B" stroke-width="14"/>
      <path d="M0 -52 A52 52 0 0 0 0 52 Z" fill="#FFD66B"/>
    </g>
  </g>
</svg>
